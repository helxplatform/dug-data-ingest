# Default values for bdc-ingest.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# When should this CronJob be executed? See
# https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/#schedule-syntax for syntax.
# Interpreted in `timeZone` below (IANA name), not UTC.
# Default: at 11am every Wednesday
schedule: "0 11 * * wed"
timeZone: America/New_York

# Amount of storage needed to download all BDC data.
dataStorage: 200Mi

# LakeFS information.
lakeFS:
  host: https://lakefs.apps.renci.org
  username: TODO # see in values-secret.yaml
  password: TODO # see in values-secret.yaml

# Slack incoming webhook for ingest run notifications. Optional -- see values-secret.yaml.
slack:
  webhookUrl: ""

# Settings for the Job executor pod.
jobExecutor:
  image:
    repository: containers.renci.org/helxplatform/dug-data-ingest
    # containers.renci.org prunes tags that don't start with "v" -- images are only
    # published from GitHub Releases now (see release-docker-to-renci-containers.yaml),
    # so this must be pinned to a real release tag, not "latest". Bump this after cutting
    # a new release.
    tag: v0.3.0alpha
    pullPolicy: Always
  restartPolicy: Never
  backoffLimit: 0
  resources:
    limits:
      cpu: 1000m
      memory: 1G
    requests:
      cpu: 500m
      memory: 1G
  securityContext: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: {}
